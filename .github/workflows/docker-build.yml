name: QR Code Generator Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ayusifu/qr_codemaker .

      - name: Test QR Code Generator
        run: |
          docker run --name qr-generator ayusifu/qr_codemaker --url https://github.com/Arafatyu/qr-code-generator.git
          docker logs qr-generator
          docker cp qr-generator:/app/qr_codes/QRCode_20261022011138.png
          test -s qr_code_test.png