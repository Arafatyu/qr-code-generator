name: QR Code Generator Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ayusifu/qr_codemaker .

            - name: Test QR Code Generator
        run: |
          docker run --name qr-generator ayusifu/qr_codemaker --url https://github.com/Arafatyu/qr-code-generator.git
          docker logs qr-generator
          mkdir -p qr_output
          docker cp qr-generator:/app/qr_codes/. ./qr_output/
          ls -l qr_output
          test -n "$(find qr_output -name 'QRCode_*.png' -size +0)"

      - name: Upload QR code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-code
          path: qr_output/*.png